services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: friotrack_dev
      POSTGRES_PASSWORD: ${FRIOTRACK_POSTGRES_PASSWORD:?Set FRIOTRACK_POSTGRES_PASSWORD in your private .env}
      POSTGRES_DB: friotrack_dev
    ports:
      - "127.0.0.1:${FRIOTRACK_POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U friotrack_dev -d friotrack_dev"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "127.0.0.1:${FRIOTRACK_HTTP_PORT:-5180}:8080"
    environment:
      FRIOTRACK_PERSISTENCE: postgres
      FRIOTRACK_DB: Host=postgres;Port=5432;Username=friotrack_dev;Password=${FRIOTRACK_POSTGRES_PASSWORD:?Set FRIOTRACK_POSTGRES_PASSWORD};Database=friotrack_dev
      FRIOTRACK_MIGRATE: "true"
      FRIOTRACK_SEED: ${FRIOTRACK_SEED:-false}
      FRIOTRACK_COORDINATOR_PASSWORD: ${FRIOTRACK_COORDINATOR_PASSWORD:-}
      FRIOTRACK_CLIENT_PASSWORD: ${FRIOTRACK_CLIENT_PASSWORD:-}
      FRIOTRACK_ORIGINS: ${FRIOTRACK_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
volumes:
  postgres-data:
